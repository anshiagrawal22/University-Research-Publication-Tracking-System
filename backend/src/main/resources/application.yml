# H2 is in-memory for Phase 2. Phase 3 should replace the datasource only.
# Entities and repositories use standard JPA — no vendor-specific SQL.
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: publication-portal
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:publications;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  seed:
    enabled: true
  crossref:
    connect-timeout: 3s
    read-timeout: 5s
