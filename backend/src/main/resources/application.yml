# File-backed H2 persists records across restarts without requiring external DB setup.
# Entities and repositories use standard JPA — no vendor-specific SQL.
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: publication-portal
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/publications;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost}
  seed:
    enabled: true
  crossref:
    connect-timeout: 3s
    read-timeout: 5s
  orcid:
    base-url: ${ORCID_API_BASE_URL:https://pub.orcid.org/v3.0}
    token-url: ${ORCID_OAUTH_TOKEN_URL:https://orcid.org/oauth/token}
    client-id: ${ORCID_CLIENT_ID:}
    client-secret: ${ORCID_CLIENT_SECRET:}
    connect-timeout: 4s
    read-timeout: 8s
    max-crossref-enrichments: 20
